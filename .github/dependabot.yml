# Weekly, grouped updates with a 7-day cooldown so a fresh release has a week to settle
# (retags, withdrawals) before it is proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    # Plugins only declare peer dependencies (no lockfile), so ds-bot is the one npm project.
    directory: /ds-bot
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    # The DSH harness is pinned per matrix leg in workflows/test.yml; bump it there by hand.
    ignore:
      - dependency-name: "@deepseek-ai/*"
    groups:
      npm-dev:
        dependency-type: development
        patterns: ["*"]
      npm-prod:
        dependency-type: production
        patterns: ["*"]
