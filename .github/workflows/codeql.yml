name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Sunday 07:13 UTC (off-peak).
    - cron: "13 7 * * 0"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      # Uploads results to the Security tab; works with GITHUB_TOKEN, no secrets.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript: ds-bot and its plugins (no build step needed).
        # actions: data-flow analysis of these workflows, complementing zizmor.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - ds-bot/**  # pristine upstream copy (ds-bot.pin.json); core/ is what ships
              - core/client.js
              - core/plugins/*/client.js
              - "**/test/**"
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
