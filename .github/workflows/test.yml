name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main a run finishes: a release waits for a green run on its commit, and one cancelled
# by every next push would leave none to wait for. A PR's run is cancelled by its next push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The PR gate: one job (see #31). Its name is the required check on main: keep it exactly.
  # Windows, macOS, Node 22 and the next DSH run nightly and on demand in compat.yml.
  test:
    name: ubuntu-latest · Node 24 · DSH 0.2.0-rc.2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flybot-tests
        with:
          node: '24'
          dsh: 0.2.0-rc.2
          coverage: 'true'

  # What a DSH profile installs: each package packs with everything its main/exports/files
  # name, and no tests or dev tools. The release job ships these same tarballs.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Pack and check ds-bot, social, tree
        run: node .github/scripts/check-pack.mjs
      - name: Typecheck the plugin API (types/*.d.ts, strict)
        working-directory: ds-bot
        run: npx --yes -p typescript@5.9.3 tsc --noEmit --strict --skipLibCheck types/*.d.ts
      - name: Changelog has an Unreleased section
        run: grep -q '^## \[Unreleased\]' CHANGELOG.md
      - name: Lint the workflows (actionlint)
        env:
          VERSION: 1.7.7
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" | tar -xz actionlint
          ./actionlint -color

  # One check that is green only when the test job and the package job are.
  tests-ok:
    name: tests-ok
    if: always()
    needs: [test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "test: $TEST, package: $PACKAGE"
          [ "$TEST" = success ] && [ "$PACKAGE" = success ]
