name: Compatibility

# The legs the PR gate (Test) no longer runs: Windows, macOS, Node 22 and the next DSH.
# Nightly on main, on demand, and on PRs that change them (Actions → Compatibility → Run workflow, any branch).
# Not required for merging; a red night shows here and in the job summary.

on:
  schedule:
    - cron: "37 18 * * *"  # 02:37 Asia/Shanghai
  workflow_dispatch:
  # A PR that changes these legs or the shared steps runs them too.
  pull_request:
    paths:
      - .github/workflows/compat.yml
      - .github/actions/flybot-tests/**

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Prefixed so these never collide with the required "ubuntu-latest · Node 24 · ..." check.
    name: compat · ${{ matrix.os }} · Node ${{ matrix.node }} · DSH ${{ matrix.dsh }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24, dsh: 0.2.0-rc.2 }
          # FlyBot's users run it on macOS (launchd profiles).
          - { os: macos-latest, node: 24, dsh: 0.2.0-rc.2 }
          - { os: ubuntu-latest, node: 22, dsh: 0.2.0-rc.2 }
          - { os: ubuntu-latest, node: 24, dsh: 0.2.1-alpha.1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/flybot-tests
        with:
          node: ${{ matrix.node }}
          dsh: ${{ matrix.dsh }}
