name: Review verdict (report only)

# #801: the other door on a conclusion that does not count. `pass-label.yml` catches a PASS posted as a
# comment; a PASS pasted into a *review body* used to get nothing at all — no label and no note. This
# workflow says so instead: one `::warning` and the same sentence in the run summary.
#
# Safety: `permissions: contents: read` and nothing else — no `issues:`, no `pull-requests:`, no
# secrets. That is not decoration. On `pull_request_review` the workflow definition runs from the merge
# ref, so a pull request can change what its own review job executes; a job that cannot write makes
# that harmless. The script is checked out from `main`, so the logic that runs is always main's even
# when this file is not.
#
# It is not a gate: no label, no comment, no approval, no merge, and exit 0 on every path — a job that
# turns red is a job people learn to ignore. Do not add a `workflow_run` relay here that comments:
# that is a separate owner decision (#801).
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  report:
    name: review body verdict (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
      - name: Report a PASS whose writer is not listed
        # The body is untrusted text: it reaches the script as an environment value, never as shell
        # text, and the script only parses it.
        env:
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_ASSOCIATION: ${{ github.event.review.author_association }}
          PR: ${{ github.event.pull_request.number }}
        run: node .github/scripts/review-verdict.mjs
